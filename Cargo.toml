[package]
name = "dbai-nokia-rs"
version = "1.1.0"
edition = "2021"
description = "Clean-room Rust reconstruction of Nokia FastMile 5G GW2 management, backup verification, and hardware metadata toolkit"
license = "MIT"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
regex = "1.10"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["rsa", "encryption", "std"] }
ureq = { version = "2.10", features = ["json", "cookies"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
