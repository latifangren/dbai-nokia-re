name: CI & Cross-Platform Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --verbose

  build-linux-x86_64:
    name: Build Linux (x86_64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (Linux x86_64)
        run: |
          cargo build --release
          cp target/release/dbai-nokia-rs dbai-nokia-linux-amd64
          chmod +x dbai-nokia-linux-amd64
          sha256sum dbai-nokia-linux-amd64 > dbai-nokia-linux-amd64.sha256

      - name: Upload Linux x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbai-nokia-linux-amd64
          path: |
            dbai-nokia-linux-amd64
            dbai-nokia-linux-amd64.sha256

  build-linux-aarch64:
    name: Build Linux (ARM64 / aarch64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compilation GCC for aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust toolchain (aarch64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (Linux ARM64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/dbai-nokia-rs dbai-nokia-linux-arm64
          chmod +x dbai-nokia-linux-arm64
          sha256sum dbai-nokia-linux-arm64 > dbai-nokia-linux-arm64.sha256

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbai-nokia-linux-arm64
          path: |
            dbai-nokia-linux-arm64
            dbai-nokia-linux-arm64.sha256

  build-windows-x86_64:
    name: Build Windows Native (x86_64, No WSL)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (Windows x86_64 Native)
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          Copy-Item "target/x86_64-pc-windows-msvc/release/dbai-nokia-rs.exe" "dbai-nokia-win64.exe"
          $hash = (Get-FileHash "dbai-nokia-win64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  dbai-nokia-win64.exe" | Out-File -Encoding ascii "dbai-nokia-win64.exe.sha256"

      - name: Upload Windows x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbai-nokia-win64
          path: |
            dbai-nokia-win64.exe
            dbai-nokia-win64.exe.sha256

  release:
    name: Publish GitHub Release
    needs: [build-linux-x86_64, build-linux-aarch64, build-windows-x86_64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dbai-nokia-linux-amd64
            dist/dbai-nokia-linux-arm64
            dist/dbai-nokia-win64.exe
            dist/SHA256SUMS.txt
